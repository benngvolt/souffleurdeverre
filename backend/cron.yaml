# Tâches planifiées App Engine. Déploiement : gcloud app deploy cron.yaml
cron:
  - description: sauvegarde chiffrée de la base (Cloud Storage + pCloud)
    url: /api/backup
    schedule: every day 03:30
    timezone: Europe/Paris
    retry_parameters:
      min_backoff_seconds: 60
      max_doublings: 3
      job_retry_limit: 2
